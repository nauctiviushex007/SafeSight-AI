<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SafeSight AI</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0b1220;--card:#121c2f;--bd:#22304a;--tx:#e6edf7;--mu:#8da0bd;--bl:#3b82f6;--tl:#2dd4bf;--rd:#ef4444;--am:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,Segoe UI,sans-serif;display:flex;min-height:100vh}
aside{width:220px;background:#0e1626;border-right:1px solid var(--bd);padding:16px;position:sticky;top:0;height:100vh}
aside h1{font-size:17px;margin:0 0 4px}aside small{color:var(--mu)}nav{margin-top:18px;display:flex;flex-direction:column;gap:2px}
nav a{color:var(--mu);text-decoration:none;padding:9px 12px;border-radius:8px}nav a:hover,nav a:focus{background:#16223a;color:var(--tx);outline:none}nav a.on{background:#17305c;color:#fff}
main{flex:1;padding:24px;max-width:1200px;min-width:0}h2{margin:0 0 16px;font-size:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}.big{font-size:28px;font-weight:700}.muted{color:var(--mu)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:13px}th{color:var(--mu);font-weight:600}
button,select,input{background:#16223a;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font:inherit}button{cursor:pointer;background:var(--bl);border:0;color:#fff}button.alt{background:#16223a;border:1px solid var(--bd)}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:30px;text-align:center;color:var(--mu)}.drop.over{border-color:var(--tl)}
.err{border-color:var(--rd);color:#fca5a5}.ok{color:var(--tl)}.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:#1d2b46}
.critical,.high{color:var(--rd)}.medium{color:var(--am)}img,video{max-width:100%;border-radius:10px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.msg{padding:10px 12px;border-radius:10px;margin:8px 0;white-space:pre-wrap}.u{background:#17305c}.a{background:#0e1626;border:1px solid var(--bd)}
@media(max-width:700px){body{flex-direction:column}aside{width:100%;height:auto;position:static}nav{flex-direction:row;flex-wrap:wrap}}
</style></head><body>
<aside><h1>SafeSight AI</h1><small>Industrial safety monitoring</small><nav>
<a href="#dashboard">Dashboard</a><a href="#vision">Vision Analysis</a><a href="#live">Live Monitoring</a><a href="#incidents">Incidents</a><a href="#assistant">Safety Assistant</a><a href="#analytics">Analytics</a><a href="#models">Model Evaluation</a></nav></aside>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s),M=$('#main');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(u,o){const r=await fetch('/api'+u,o);if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(typeof d.detail==='string'?d.detail:r.statusText)}return r.json()}
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const empty=t=>`<div class="card muted">${t}</div>`;let charts=[];
function chart(id,type,obj,label){const c=new Chart($('#'+id),{type,data:{labels:Object.keys(obj),datasets:[{label,data:Object.values(obj),backgroundColor:['#3b82f6','#2dd4bf','#f59e0b','#ef4444','#8b5cf6'],borderColor:'#3b82f6',tension:.3}]},options:{plugins:{legend:{labels:{color:'#8da0bd'}}},scales:type==='doughnut'?{}:{x:{ticks:{color:'#8da0bd'}},y:{ticks:{color:'#8da0bd'},beginAtZero:true}}}});charts.push(c)}
const incTable=l=>l.length?`<table><tr><th>ID</th><th>Time</th><th>Category</th><th>Severity</th><th>Conf.</th><th>Certainty</th><th>Status</th></tr>${l.map(i=>`<tr><td>${i.id}</td><td>${new Date(i.timestamp+'Z').toLocaleString()}</td><td>${i.category}</td><td class="${i.severity}">${i.severity}</td><td>${(i.confidence*100).toFixed(0)}%</td><td>${i.certainty}</td><td><span class="tag">${i.status}</span></td></tr>`).join('')}</table>`:'<p class="muted">No incidents yet.</p>';

async function dashboard(){
  const s=await api('/dashboard/summary');
  let l=[];try{const rows=await api('/incidents');if(Array.isArray(rows))l=rows.slice(0,8)}catch(e){console.warn('Recent incidents unavailable:',e)}
  const total=Number(s.total_events)||0, ppe=Number(s.ppe_violations)||0, zone=Number(s.restricted_zone_alerts)||0, pending=Number(s.pending_review)||0;
  const days=Array.isArray(s.events_over_time)?s.events_over_time:[];
  const cats=s.by_category&&typeof s.by_category==='object'?s.by_category:{};
  M.innerHTML=`<h2>Dashboard</h2>${s.has_data?'':empty('No events recorded yet. Use Vision Analysis to process an image and create events.')}
  <div class="grid">${[['Total events',total],['Potential PPE violations',ppe],['Restricted-zone alerts',zone],['Awaiting review',pending]].map(([a,b])=>`<div class="card"><div class="muted">${a}</div><div class="big">${b}</div></div>`).join('')}</div>
  <div class="grid"><div class="card"><canvas id="c1"></canvas></div><div class="card"><canvas id="c2"></canvas></div></div>
  <div class="card"><b>Recent incidents</b>${incTable(l)}</div><div class="row"><a href="#vision"><button>Analyse image/video</button></a><a href="#assistant"><button class="alt">Ask safety assistant</button></a></div>`;
  if(typeof Chart!=='undefined'){
    try{chart('c1','line',Object.fromEntries(days.map(e=>[e.date,e.count])),'Events per day')}catch(e){console.warn('Events chart unavailable:',e)}
    try{chart('c2','doughnut',cats,'By category')}catch(e){console.warn('Category chart unavailable:',e)}
  }
}

async function vision(){M.innerHTML=`<h2>Vision Analysis</h2><div class="card"><div class="drop" id="dz">Drag &amp; drop an image/video here or <input type="file" id="f" accept="image/*,video/*"></div>
<div class="row" style="margin-top:12px"><label>Confidence <input type="number" id="cf" value="0.35" min="0.05" max="0.95" step="0.05" style="width:80px"></label><button id="go">Analyse</button><button class="alt" id="clr">Clear</button></div><div id="pv"></div></div><div id="res"></div>`;
const f=$('#f'),dz=$('#dz');dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=e=>{e.preventDefault();f.files=e.dataTransfer.files;f.onchange()};
f.onchange=()=>{const x=f.files[0];if(!x)return;const u=URL.createObjectURL(x);$('#pv').innerHTML=x.type.startsWith('video')?`<video src="${u}" controls></video>`:`<img src="${u}">`};
$('#clr').onclick=()=>{f.value='';$('#pv').innerHTML='';$('#res').innerHTML=''};
$('#go').onclick=async()=>{const x=f.files[0];if(!x)return $('#res').innerHTML=empty('Choose a file first.');if(x.size>100*1024*1024)return $('#res').innerHTML='<div class="card err">File exceeds 100 MB.</div>';
$('#res').innerHTML='<div class="card">Analysing… (videos can take a while)</div>';const fd=new FormData();fd.append('file',x);fd.append('conf',$('#cf').value);
try{const r=await(await fetch('/api/vision/analyze',{method:'POST',body:fd}).then(async q=>{if(!q.ok)throw new Error((await q.json()).detail);return q})).json();showRes(r)}catch(e){$('#res').innerHTML=`<div class="card err">${esc(e.message)}</div>`}}}
function showRes(r){const cls=[...new Set(r.detections.map(d=>d.raw))];
$('#res').innerHTML=`<div class="card"><div class="row"><b>Result</b><span class="muted">${r.ms} ms · ${r.detections.length} detections · ${r.violations.length} potential violations</span>${r.output?`<a href="${r.output}" download><button class="alt">Download output</button></a>`:''}</div>
${r.output?(r.output.endsWith('.mp4')?`<video src="${r.output}" controls></video>`:`<img src="${r.output}">`):''}
${r.violations.map(v=>`<p class="${v.severity}">⚠ ${esc(v.category)} (${v.certainty}) — ${esc(v.description)}</p>`).join('')}
<div class="row"><label>Filter <select id="fl"><option value="">All</option>${cls.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label></div><div id="tb"></div></div>`;
const draw=()=>{const v=$('#fl').value;$('#tb').innerHTML=`<table><tr><th>Class</th><th>Mapped to</th><th>Confidence</th><th>Box</th></tr>${r.detections.filter(d=>!v||d.raw===v).map(d=>`<tr><td>${esc(d.raw)}</td><td>${d.label||'—'}</td><td>${(d.confidence*100).toFixed(1)}%</td><td>${d.bbox.map(Math.round)}</td></tr>`).join('')}</table>`};$('#fl').onchange=draw;draw()}

let stream,timer;async function live(){M.innerHTML=`<h2>Live Monitoring</h2><div class="card"><div class="row"><select id="src"><option value="web">Local webcam (browser)</option><option value="rtsp">Server RTSP/CCTV</option></select><button id="st">Start</button><button class="alt" id="sp">Stop</button><span id="stat" class="muted">Disconnected</span><span id="fps" class="muted"></span></div><div id="lv"></div>
<div class="grid"><video id="vid" autoplay muted playsinline></video><img id="ov" alt=""></div></div><div class="card"><b>Event feed</b><div id="feed" class="muted">No events yet.</div></div>`;
$('#st').onclick=async()=>{if($('#src').value==='rtsp')return $('#lv').innerHTML='<p class="err">Server-side RTSP is not configured. Add camera settings to the backend .env (credentials stay server-side).</p>';
try{stream=await navigator.mediaDevices.getUserMedia({video:true});$('#vid').srcObject=stream;$('#stat').textContent='Connected';$('#stat').className='ok';timer=setInterval(grab,2500)}catch(e){$('#lv').innerHTML=`<p class="err">Camera unavailable: ${esc(e.message)}</p>`}};
$('#sp').onclick=stop;let frameInFlight=false;
async function grab(){
const v=$('#vid');if(frameInFlight||!v||!v.videoWidth)return;frameInFlight=true;
try{const c=document.createElement('canvas');c.width=Math.min(v.videoWidth,640);c.height=Math.round(v.videoHeight*c.width/v.videoWidth);c.getContext('2d').drawImage(v,0,0,c.width,c.height);
const blob=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',.7));if(!blob)throw new Error('Camera frame capture failed');
const fd=new FormData();fd.append('file',blob,'webcam.jpg');fd.append('save','true');const response=await fetch('/api/vision/analyze',{method:'POST',body:fd});const raw=await response.text();let r;
try{r=JSON.parse(raw)}catch{throw new Error(raw.trim()||'Empty response (HTTP '+response.status+'); retrying')}
if(!response.ok)throw new Error((r&&r.detail)||('HTTP '+response.status+'; retrying'));if(r.detail)throw new Error(r.detail);
if(r.output)$('#ov').src=r.output+'?t='+Date.now();$('#fps').textContent='Latency '+Math.round(Number(r.ms)||0)+' ms';
if(Array.isArray(r.violations)&&r.violations.length)$('#feed').innerHTML=r.violations.map(x=>'<div class="'+esc(x.severity)+'">'+new Date().toLocaleTimeString()+' — '+esc(x.category)+' ('+esc(x.certainty)+')</div>').join('')+$('#feed').innerHTML;
}catch(e){const f=$('#fps');if(f)f.textContent='Frame failed; retrying: '+esc(e.message)}finally{frameInFlight=false}
}
}

function stop(){clearInterval(timer);stream&&stream.getTracks().forEach(t=>t.stop());stream=null;const s=$('#stat');if(s){s.textContent='Disconnected';s.className='muted'}}

async function incidents(){M.innerHTML=`<h2>Incident Management</h2><div class="card"><div class="row"><input id="q" placeholder="Search…"><select id="s"><option value="">Any status</option><option>pending_review</option><option>confirmed</option><option>rejected</option></select><select id="o"><option value="-timestamp">Newest</option><option value="-confidence">Confidence</option><option value="-severity">Severity</option></select><a href="/api/incidents/export/csv"><button class="alt">Export CSV</button></a></div><div id="t"></div></div><div id="d"></div>`;
const load=async()=>{const l=await api(`/incidents?q=${encodeURIComponent($('#q').value)}&status=${$('#s').value}&sort=${$('#o').value}`);$('#t').innerHTML=incTable(l);document.querySelectorAll('#t tr').forEach((tr,i)=>{if(i)tr.style.cursor='pointer',tr.onclick=()=>detail(l[i-1])})};
['q','s','o'].forEach(i=>$('#'+i).oninput=load);load();
window.detail=i=>{$('#d').innerHTML=`<div class="card"><b>${i.id}</b> <span class="tag">${i.status}</span><p>${esc(i.description)}</p><p class="muted">Source: ${esc(i.source)} · Certainty: ${i.certainty}<br>Follow-up: ${esc(i.recommended_action)}</p>${i.evidence_ref?(i.evidence_ref.endsWith('.mp4')?`<video src="${i.evidence_ref}" controls></video>`:`<img src="${i.evidence_ref}">`):''}
<div class="row"><input id="n" placeholder="Reviewer notes" value="${esc(i.reviewer_notes||'')}" style="flex:1"><button onclick="rv('${i.id}','confirmed')">Confirm</button><button class="alt" onclick="rv('${i.id}','rejected')">Reject</button></div></div>`};
window.rv=async(id,s)=>{await api(`/incidents/${id}/review`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s,reviewer_notes:$('#n').value})});incidents()}}

async function assistant(){const docs=await api('/rag/documents');M.innerHTML=`<h2>RAG Safety Assistant</h2><div class="card"><div class="row"><input type="file" id="df" accept=".pdf,.txt"><button id="up">Upload &amp; index</button><span id="us" class="muted"></span></div>
<div class="muted">${docs.length?'Indexed: '+docs.map(d=>`${esc(d.name)} (${d.chunks} chunks)`).join(', '):'No documents indexed. Upload a PDF or TXT safety manual to begin.'}</div></div>
<div class="card"><div id="chat"></div><div class="row"><input id="qq" placeholder="e.g. What PPE is required in restricted zones?" style="flex:1"><button id="ask">Ask</button></div></div>`;
$('#up').onclick=async()=>{const x=$('#df').files[0];if(!x)return;const fd=new FormData();fd.append('file',x);$('#us').textContent='Indexing…';try{const r=await fetch('/api/rag/upload',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw new Error(j.detail);assistant()}catch(e){$('#us').textContent=e.message;$('#us').className='err'}};
const send=async()=>{const q=$('#qq').value.trim();if(!q)return;$('#qq').value='';$('#chat').innerHTML+=`<div class="msg u">${esc(q)}</div>`;try{const r=await post('/rag/ask',{question:q});$('#chat').innerHTML+=`<div class="msg a">${esc(r.answer)}${r.sources.length?'<hr><small class="muted">Sources:<br>'+r.sources.map((s,i)=>`[${i+1}] ${esc(s.doc)}${s.page?', p.'+s.page:''} — “${esc(s.snippet.slice(0,140))}…”`).join('<br>')+'</small>':''}</div>`}catch(e){$('#chat').innerHTML+=`<div class="msg err">${esc(e.message)}</div>`}};
$('#ask').onclick=send;$('#qq').onkeydown=e=>e.key==='Enter'&&send()}

async function analytics(){M.innerHTML=`<h2>Analytics</h2><div class="row"><select id="dy"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="365">1 year</option></select><select id="ct"><option value="">All categories</option><option>no_helmet</option><option>no_vest</option><option>restricted_zone</option></select><a href="/api/incidents/export/csv"><button class="alt">Export CSV</button></a></div><div id="an"></div>`;
const go=async()=>{charts.forEach(c=>c.destroy());charts=[];const a=await api(`/analytics?days=${$('#dy').value}&category=${$('#ct').value}`);$('#an').innerHTML=a.total?`<div class="grid"><div class="card"><canvas id="a1"></canvas></div><div class="card"><canvas id="a2"></canvas></div><div class="card"><canvas id="a3"></canvas></div><div class="card"><canvas id="a4"></canvas></div></div>`:empty('No incidents in this range.');
if(a.total){chart('a1','line',a.by_day,'Incidents per day');chart('a2','doughnut',a.by_category,'Category');chart('a3','bar',a.by_severity,'Severity');chart('a4','bar',a.by_status,'Reviewed vs pending')}};
$('#dy').onchange=$('#ct').onchange=go;go()}

async function models(){const s=await api('/models/status'),y=s.yolo,m=s.svm;M.innerHTML=`<h2>Model Evaluation</h2><div class="card"><b>YOLO detector</b><p class="${y.loaded?'ok':'err'}">${y.loaded?'Loaded':'Not loaded'} — ${esc(y.path)}</p>${y.error?`<p class="muted">${esc(y.error)}</p>`:`<p>Classes: ${y.classes.map(esc).join(', ')}<br>App categories supported: ${y.supported_categories.join(', ')||'none'}</p>`}<p class="muted">Precision/recall/F1 for YOLO: Not evaluated yet (run <code>yolo val</code> on your dataset).</p></div>
<div class="card"><b>SVM review classifier</b> <button id="tr" class="alt">Train / retrain</button> <span id="ts" class="muted"></span>${m?`<p class="muted">Dataset: ${esc(m.dataset)} · train ${m.n_train} / test ${m.n_test}</p><table><tr><th>Model</th><th>Precision</th><th>Recall</th><th>F1</th></tr>${[['SVM (RBF)',m.svm],['Baseline (majority)',m.baseline]].map(([n,r])=>`<tr><td>${n}</td>${['precision','recall','f1-score'].map(k=>`<td>${r['weighted avg'][k].toFixed(3)}</td>`).join('')}</tr>`).join('')}</table><p>Confusion matrix [[TN,FP],[FN,TP]]: ${JSON.stringify(m.confusion_matrix)}</p><p class="muted">${esc(m.limitations)}</p>`:'<p class="muted">Not evaluated yet.</p>'}</div>
<div class="card"><b>Limitations</b><ul>${s.limitations.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`;
$('#tr').onclick=async()=>{$('#ts').textContent='Training…';try{await api('/svm/train',{method:'POST'});models()}catch(e){$('#ts').textContent=e.message}}}

const pages={dashboard,vision,live,incidents,assistant,analytics,models};
function nav(){stop();charts.forEach(c=>c.destroy());charts=[];const p=(location.hash||'#dashboard').slice(1);document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.hash==='#'+p));(pages[p]||dashboard)().catch(e=>M.innerHTML=`<div class="card err">${esc(e.message)}</div>`)}
addEventListener('hashchange',nav);nav();
</script></body></html>
